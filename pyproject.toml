[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zecto"
version = "0.1.0"
description = "Python SDK for the Zecto multi-channel messaging platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zecto" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]
keywords = ["zecto", "whatsapp", "whatsapp-business", "messaging", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://zecto.io"
Repository = "https://github.com/zecto-comms/zecto-python"
Issues = "https://github.com/zecto-comms/zecto-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["zecto"]

[tool.hatch.build.targets.sdist]
include = ["zecto", "README.md", "LICENSE", "pyproject.toml"]
